# vmalert-tool unit tests for the non-obvious exprs in ../rules.nix.
#
# `../rules.yml` is sauna's rendered rules file, placed there by
# nixos/tests/o11y-alerting-unit.nix. Time starts at 2000-01-01T00:00:00Z.
# Annotations must match exactly.
#
# Host scoping: sauna is the only alerted host (`server.alerting.instances`
# default). `phlipdesk` stands in for any other host that pushes metrics.
rule_files: [../rules.yml]
evaluation_interval: 1m

tests:
  # Grafana creates the health check counter on its first check, so a Git
  # Sync controller stuck since startup leaves no series at all.
  - name: GrafanaSyncStalled fires w/o any health check series
    interval: 1m
    input_series:
      - series: 'grafana_stat_totals_repositories{job="grafana"}'
        values: 1x40
    alert_rule_test:
      - eval_time: 29m
        groupname: grafana
        alertname: GrafanaSyncStalled
        exp_alerts: []
      - eval_time: 30m
        groupname: grafana
        alertname: GrafanaSyncStalled
        exp_alerts:
          - exp_labels:
              severity: warn
            exp_annotations:
              summary: Grafana Git Sync stopped checking its repository
              description: systemctl restart grafana-git-sync-setup

  # `nixbot_builds` is a gauge: retention cleanup drops 50 succeeded rows
  # at 30m, while 4 builds fail. Unclamped, `done` would go negative.
  - name: NixbotBuildFailures counts new failures across a cleanup
    interval: 1m
    input_series:
      - series: 'nixbot_builds{status="succeeded", instance="sauna"}'
        values: 100x29 50x31
      - series: 'nixbot_builds{status="failed", instance="sauna"}'
        values: 10x9 11x10 12x10 13x10 14x20
    alert_rule_test:
      # 2 new failures: not enough
      - eval_time: 20m
        groupname: nixbot
        alertname: NixbotBuildFailures
        exp_alerts: []
      - eval_time: 60m
        groupname: nixbot
        alertname: NixbotBuildFailures
        exp_alerts:
          - exp_labels:
              severity: info
              instance: sauna
            exp_annotations:
              summary: Most nixbot builds failed in the last hour
              description: https://ci.phlip9.com

  # Boot 2's first sample is at 66m, after a 5m scrape gap. Fires from
  # then until the 15m-old value is boot 2 too.
  - name: HostRebooted fires for 15m after a reboot, across a scrape gap
    interval: 1m
    input_series:
      - series: 'nixos_boots_total{job="nixos-exporter", instance="sauna"}'
        values: 1x60 _x5 2x60
    alert_rule_test:
      - eval_time: 65m
        groupname: host
        alertname: HostRebooted
        exp_alerts: []
      - eval_time: 66m
        groupname: host
        alertname: HostRebooted
        exp_alerts: &host_rebooted
          - exp_labels:
              severity: info
              job: nixos-exporter
              instance: sauna
            exp_annotations:
              summary: sauna rebooted (boot 2)
              description: Expected after a deploy w/ a new kernel; else why?
      - eval_time: 80m
        groupname: host
        alertname: HostRebooted
        exp_alerts: *host_rebooted
      - eval_time: 81m
        groupname: host
        alertname: HostRebooted
        exp_alerts: []

  # A series that starts mid-life (relabel, first install) isn't a reboot.
  - name: HostRebooted ignores a new boot count series
    interval: 1m
    input_series:
      - series: 'nixos_boots_total{job="nixos-exporter", instance="sauna"}'
        values: _x30 2x60
    alert_rule_test:
      - eval_time: 30m
        groupname: host
        alertname: HostRebooted
        exp_alerts: []
      - eval_time: 40m
        groupname: host
        alertname: HostRebooted
        exp_alerts: []

  # Timers that never ran report 0. Don't call them 30 years stale.
  - name: TimerStale skips never-run timers
    interval: 1m
    input_series:
      - series: >-
          node_systemd_timer_last_trigger_seconds{name="nix-gc.timer",
          instance="sauna"}
        values: 0x5
      # last ran 40h before the test starts
      - series: >-
          node_systemd_timer_last_trigger_seconds{name="niks3-gc.timer",
          instance="sauna"}
        values: 946540800x5
    alert_rule_test:
      - eval_time: 5m
        groupname: systemd
        alertname: TimerStale
        exp_alerts:
          - exp_labels:
              severity: warn
              name: niks3-gc.timer
              instance: sauna
            exp_annotations:
              summary: niks3-gc.timer last ran 1d 16h 5m 0s ago
              description: systemctl list-timers; journalctl -u <its service>

  # 500 GB free: `a` loses 30 GB/h (full in ~17h), `b` 12 GB/h (~42h).
  - name: RootDiskFill24h fires only when / fills within 24h
    interval: 1m
    input_series:
      - series: >-
          node_filesystem_avail_bytes{mountpoint="/", instance="sauna",
          device="a"}
        values: 500000000000-500000000x40
      - series: >-
          node_filesystem_avail_bytes{mountpoint="/", instance="sauna",
          device="b"}
        values: 500000000000-200000000x40
    alert_rule_test:
      - eval_time: 35m
        groupname: storage
        alertname: RootDiskFill24h
        exp_alerts:
          - exp_labels:
              severity: warn
              mountpoint: /
              instance: sauna
              device: a
            exp_annotations:
              summary: / fills up within 24h at the 6h trend
              description: Who's writing? du -xsh /var/lib/*

  # The write drop counter only exists after its first drop: the regex
  # matcher must still count it, w/o an `or vector(0)` dance.
  - name: ProfilesDropped counts a drop counter that appears late
    interval: 1m
    input_series:
      - series: >-
          pyroscope_ebpf_pprofs_dropped_total{job="alloy", instance="sauna"}
        values: 0x40
      - series: >-
          pyroscope_write_dropped_profiles_total{job="alloy",
          instance="sauna", endpoint="local"}
        values: _x9 1+1x30
    alert_rule_test:
      # Still pending
      - eval_time: 20m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts: []
      - eval_time: 30m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts:
          - exp_labels:
              severity: warn
              instance: sauna
            exp_annotations:
              summary: Alloy dropped 5 profiles in 5m
              description: journalctl -u alloy -u pyroscope

  # eBPF drops alone, w/o any write drop series
  - name: ProfilesDropped fires on eBPF drops alone
    interval: 1m
    input_series:
      - series: >-
          pyroscope_ebpf_pprofs_dropped_total{job="alloy", instance="sauna"}
        values: 0+2x40
    alert_rule_test:
      - eval_time: 30m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts:
          - exp_labels:
              severity: warn
              instance: sauna
            exp_annotations:
              summary: Alloy dropped 10 profiles in 5m
              description: journalctl -u alloy -u pyroscope

  # A 3-min burst, then quiet: shorter than the `for`, must not fire.
  - name: ProfilesDropped ignores a short completed burst
    interval: 1m
    input_series:
      - series: >-
          pyroscope_ebpf_pprofs_dropped_total{job="alloy", instance="sauna"}
        values: 0x9 1 2 3x30
    alert_rule_test:
      - eval_time: 12m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts: []
      - eval_time: 25m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts: []
      - eval_time: 30m
        groupname: profiling
        alertname: ProfilesDropped
        exp_alerts: []

  # Another host's bad values must not fire anything: low memory, full disk,
  # failed unit, reboot, stale timer, bad clock, high load. Every `for` has
  # passed by 40m.
  - name: A non-alerted host fires no host alerts
    interval: 1m
    input_series:
      - series: >-
          node_memory_MemAvailable_bytes{job="node-exporter",
          instance="phlipdesk"}
        values: 1e9x40
      - series: >-
          node_memory_MemTotal_bytes{job="node-exporter",
          instance="phlipdesk"}
        values: 100e9x40
      - series: >-
          node_filesystem_avail_bytes{mountpoint="/", instance="phlipdesk"}
        values: 1e9x40
      - series: >-
          node_filesystem_size_bytes{mountpoint="/", instance="phlipdesk"}
        values: 100e9x40
      - series: >-
          node_systemd_unit_state{name="foo.service", state="failed",
          instance="phlipdesk"}
        values: 1x40
      - series: >-
          node_systemd_unit_state{name="sshd.service", state="active",
          instance="phlipdesk"}
        values: 0x40
      - series: 'nixos_boots_total{instance="phlipdesk"}'
        values: 1x20 2x20
      # last ran 40h before the test starts
      - series: >-
          node_systemd_timer_last_trigger_seconds{name="niks3-gc.timer",
          instance="phlipdesk"}
        values: 946540800x40
      - series: 'node_timex_sync_status{instance="phlipdesk"}'
        values: 0x40
      - series: 'node_load5{instance="phlipdesk"}'
        values: 100x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="0", instance="phlipdesk"}
        values: 0+60x40
    alert_rule_test:
      - {eval_time: 40m, groupname: host, alertname: MemLow, exp_alerts: []}
      - {eval_time: 22m, groupname: host, alertname: HostRebooted, exp_alerts: []}
      - {eval_time: 40m, groupname: host, alertname: ClockBad, exp_alerts: []}
      - {eval_time: 40m, groupname: host, alertname: LoadHigh, exp_alerts: []}
      - eval_time: 40m
        groupname: storage
        alertname: RootDiskFull
        exp_alerts: []
      - eval_time: 40m
        groupname: systemd
        alertname: UnitFailed
        exp_alerts: []
      - eval_time: 40m
        groupname: systemd
        alertname: UnitNotActive
        exp_alerts: []
      - eval_time: 40m
        groupname: systemd
        alertname: TimerStale
        exp_alerts: []

  # TargetDown: an alerted host's targets + blackbox's (labeled w/ the probe
  # URL), never another host's.
  - name: TargetDown covers sauna + blackbox, not other hosts
    interval: 1m
    input_series:
      - series: 'up{job="nixos-exporter", instance="sauna"}'
        values: 0x10
      - series: 'up{job="blackbox", instance="https://example.com/"}'
        values: 0x10
      - series: 'up{job="node-exporter", instance="phlipdesk"}'
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        groupname: targets
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warn
              job: nixos-exporter
              instance: sauna
            exp_annotations:
              summary: nixos-exporter scrape failing
              description: Service down or wedged? journalctl -u <its unit>
          - exp_labels:
              severity: warn
              job: blackbox
              instance: https://example.com/
            exp_annotations:
              summary: blackbox scrape failing
              description: Service down or wedged? journalctl -u <its unit>

  # sauna: load5 5 on 2 threads = 2.5x. phlipdesk: 8 threads, load 100. A
  # CPU count across hosts would divide by 8 (no alert); per host it's 2.
  # phlipdesk's own 12.5x must not fire.
  - name: LoadHigh divides by each host's own CPU count
    interval: 1m
    input_series:
      - series: 'node_load5{job="node-exporter", instance="sauna"}'
        values: 5x40
      - series: 'node_cpu_seconds_total{mode="idle", cpu="0", instance="sauna"}'
        values: 0+60x40
      - series: 'node_cpu_seconds_total{mode="idle", cpu="1", instance="sauna"}'
        values: 0+60x40
      - series: 'node_load5{job="node-exporter", instance="phlipdesk"}'
        values: 100x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="0",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="1",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="2",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="3",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="4",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="5",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="6",
          instance="phlipdesk"}
        values: 0+60x40
      - series: >-
          node_cpu_seconds_total{mode="idle", cpu="7",
          instance="phlipdesk"}
        values: 0+60x40
    alert_rule_test:
      - eval_time: 31m
        groupname: host
        alertname: LoadHigh
        exp_alerts:
          - exp_labels:
              severity: info
              job: node-exporter
              instance: sauna
            exp_annotations:
              summary: load5 at 2.5x the CPU threads
              description: Runaway CI build or agent? systemd-cgtop

  # Both hosts' node-exporter `up` stops after 10m, like a dead vmagent or
  # a powered-off host. Only sauna's fires: 3m w/o a sample, then the 2m
  # `for`.
  - name: HostNotReporting fires only for an alerted host
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="sauna"}'
        values: 1x10
      - series: 'up{job="node-exporter", instance="phlipdesk"}'
        values: 1x10
    alert_rule_test:
      - eval_time: 12m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 14m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 15m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: &host_not_reporting
          - exp_labels:
              severity: page
              job: node-exporter
              instance: sauna
            exp_annotations:
              summary: sauna stopped reporting metrics
              description: >-
                Host down, or vmagent / node-exporter dead? systemctl status
                vmagent prometheus-node-exporter
      - eval_time: 30m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: *host_not_reporting

  # A deploy restarts vmagent (or node-exporter) and misses a scrape or
  # two, ex: 2 scrapes at 11m + 12m. Not a stopped host. Neither is a
  # target that's down but still scraped (`up == 0`, see TargetDown).
  - name: HostNotReporting ignores short scrape gaps + down targets
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="sauna"}'
        values: 1x10 _x2 1x5 0x20
    alert_rule_test:
      - eval_time: 13m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 16m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: []
      - eval_time: 35m
        groupname: targets
        alertname: HostNotReporting
        exp_alerts: []
